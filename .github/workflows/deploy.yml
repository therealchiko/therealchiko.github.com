name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      newsletter_dry_run:
        description: Check newsletter drafts without creating any
        type: boolean
        default: false
      newsletter_post_url:
        description: Optional published article URL to check (also recognises existing manual drafts)
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test newsletter draft automation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build Astro
        run: npm run build

      - name: Save the feed included in this deployment
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-feed
          path: dist/client/rss.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  newsletter:
    name: Create Buttondown drafts
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: newsletter-feed
          path: deployed-feed
      - name: Create drafts for review
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.newsletter_dry_run }}
          POST_URL: ${{ inputs.newsletter_post_url }}
        shell: bash
        run: |
          args=(--feed-file deployed-feed/rss.xml)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$POST_URL" ]]; then args+=(--only-url "$POST_URL"); fi
          python3 scripts/buttondown_drafts.py "${args[@]}"
